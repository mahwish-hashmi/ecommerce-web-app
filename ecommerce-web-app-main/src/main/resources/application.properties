# ?????????????????????????????????????????????
#  Application
# ?????????????????????????????????????????????
spring.application.name=ecom-proj

# ?????????????????????????????????????????????
#  MySQL DataSource
#  Override these via environment variables in
#  production:
#    DB_URL / DB_USERNAME / DB_PASSWORD
# ?????????????????????????????????????????????
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecomdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Mahi@635Hash}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????????
#  HikariCP Connection Pool (production-tuned)
# ?????????????????????????????????????????????
spring.datasource.hikari.pool-name=EcomHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ?????????????????????????????????????????????
#  JPA / Hibernate
# ?????????????????????????????????????????????
# 'update' keeps existing data and adds new columns/tables automatically.
# Use 'validate' once the schema is stable, or manage schema with Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ensures large binary (BLOB) columns are stored correctly in MySQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ?????????????????????????????????????????????
#  Multipart (image uploads)
# ?????????????????????????????????????????????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ?????????????????????????????????????????????
#  Logging
# ?????????????????????????????????????????????
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.telusko=INFO